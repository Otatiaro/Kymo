[package]
name = "kymo-ui"
version = "0.0.0"
edition = "2024"
license = "MIT"
description = "Kymo timeline: shows a capture made by kymo record"
publish = false

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["wgpu", "default_fonts", "persistence", "wayland", "x11"] }
egui_extras = { version = "0.37", default-features = false }
kymo = { path = ".." }
rfd = "0.18"

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
windows-sys = { version = "0.61", features = ["Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging"] }
