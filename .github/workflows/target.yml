name: Target

on:
  push:
    branches: [master]
    paths: ['target/**', 'host/**', '.github/workflows/target.yml']
  pull_request:
    branches: [master]
    paths: ['target/**', 'host/**', '.github/workflows/target.yml']

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  TOOLCHAIN_VERSION: '16.2.0-1'
  # The OpSy the adapter is tested against. A change on OpSy's side reaches
  # Kymo when this moves.
  OPSY_COMMIT: db01fd80420c9741469f4919b3a4905e249a921f
  # The FreeRTOS kernel the adapter is tested against: V11.3.3.
  FREERTOS_COMMIT: 89592801dd8b73329a7583719b7e3567b50910e5

# The target tests under QEMU, on Cortex-M33 and Cortex-M4: type ids, lock-free
# writes and the control word under preemption, event layouts read by the host
# against the target's, copies of the ring decoded by the host against the
# events written, what the host records of a running image, pointer fields
# named from the ELF, and the cost of an emit against its record; then the OpSy adapter on OpSy's own suite and
# bench, and the FreeRTOS adapter on its test application.
# One compiler, GCC 16, from Otatiaro/arm-none-eabi-toolchain.
jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install the arm-none-eabi toolchain
        uses: Otatiaro/arm-none-eabi-toolchain@bdf7759e264645bbcf02cfb66596869ff8684821
        with:
          version: ${{ env.TOOLCHAIN_VERSION }}

      - name: Install Ninja and QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build qemu-system-arm
          qemu-system-arm --version | head -1

      # The host's dependencies and build, kept between runs.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: host

      # kymo events, kymo decode and kymo record, for the layout, decode,
      # record and symbols tests; then the host's own tests, its format and
      # its lints.
      - name: Build the host
        run: |
          sudo apt-get install -y libudev-dev
          cargo build --release --manifest-path host/Cargo.toml
          cargo test --release --manifest-path host/Cargo.toml
          cargo fmt --check --manifest-path host/Cargo.toml
          cargo clippy --all-targets --manifest-path host/Cargo.toml -- -D warnings

      - name: Configure
        run: >
          cmake -S target/tests -B build
          -G Ninja
          -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/target/cmake/arm-none-eabi.cmake

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure --verbose

  # The timeline, kymo-ui: its build, tests, format and lints, and the kymo
  # binary held free of its graphics stack.
  timeline:
    name: Timeline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: host

      - name: Build and test kymo-ui
        run: |
          sudo apt-get update && sudo apt-get install -y libudev-dev
          cargo build --release --manifest-path host/Cargo.toml -p kymo-ui
          cargo test --release --manifest-path host/Cargo.toml -p kymo-ui
          cargo fmt --check --manifest-path host/Cargo.toml -p kymo-ui
          cargo clippy --all-targets --manifest-path host/Cargo.toml -p kymo-ui -- -D warnings

      - name: The kymo binary pulls no graphics
        run: |
          set -euo pipefail
          if cargo tree --manifest-path host/Cargo.toml -p kymo -e normal --prefix none | grep -E '^(egui|eframe|wgpu|winit) '; then
            echo "kymo depends on a graphics crate" >&2
            exit 1
          fi

  # The host on Linux ARM64, the platform of a recorder at the bench (a
  # Raspberry Pi): kymo and kymo-ui built, tested and linted there. Format
  # does not depend on the platform and is checked above.
  arm64:
    name: Host on Linux ARM64
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: host

      - name: Build and test kymo and kymo-ui
        run: |
          sudo apt-get update && sudo apt-get install -y libudev-dev
          cargo build --release --workspace --manifest-path host/Cargo.toml
          cargo test --release --workspace --manifest-path host/Cargo.toml
          cargo clippy --all-targets --workspace --manifest-path host/Cargo.toml -- -D warnings

  # The host on Windows, the platform of a desk: kymo and kymo-ui built,
  # tested and linted there.
  windows:
    name: Host on Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: host

      - name: Build and test kymo and kymo-ui
        run: |
          cargo build --release --workspace --manifest-path host/Cargo.toml
          cargo test --release --workspace --manifest-path host/Cargo.toml
          cargo clippy --all-targets --workspace --manifest-path host/Cargo.toml -- -D warnings

  # The table the host's std::format specifications are tested against
  # (host/src/format/reference.txt), produced again by libstdc++: it must not
  # change but for the cases libstdc++.txt lists, each with the libstdc++ bug
  # behind it. The committed table comes from MSVC's standard library.
  format:
    name: std::format reference
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Compare with libstdc++
        run: |
          g++ --version | head -1
          g++ -std=c++20 -O1 host/src/format/reference.cpp -o reference
          ./reference > reference.txt
          python3 host/src/format/compare.py host/src/format/reference.txt reference.txt host/src/format/libstdc++.txt

  # The host's dependencies against the RustSec advisory database.
  audit:
    name: Dependency advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: cargo audit
        run: |
          cargo install --locked cargo-audit
          cargo audit --file host/Cargo.lock

  # clang-tidy over the target code, with the .clang-tidy files under target/:
  # the library and its tests, and the OpSy adapter with its
  # test, each as the Arm toolchain compiles it (target/tidy.py); each public
  # header also on its own, with the library's checks. In the OpSy
  # tree only the adapter's test is Kymo's; OpSy's own sources are not checked.
# Likewise the FreeRTOS adapter and its test application, not the kernel.
  tidy:
    name: clang-tidy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/checkout@v5
        with:
          repository: Otatiaro/OpSy
          ref: ${{ env.OPSY_COMMIT }}
          path: opsy

      - uses: actions/checkout@v5
        with:
          repository: FreeRTOS/FreeRTOS-Kernel
          ref: ${{ env.FREERTOS_COMMIT }}
          path: freertos

      - name: Install the arm-none-eabi toolchain
        uses: Otatiaro/arm-none-eabi-toolchain@bdf7759e264645bbcf02cfb66596869ff8684821
        with:
          version: ${{ env.TOOLCHAIN_VERSION }}

      - name: Install Ninja and clang-tidy
        run: |
          sudo apt-get update && sudo apt-get install -y ninja-build
          pip install clang-tidy==23.1.4
          clang-tidy --version

      - name: Configure
        run: |
          set -euo pipefail
          toolchain="-DCMAKE_TOOLCHAIN_FILE=$GITHUB_WORKSPACE/target/cmake/arm-none-eabi.cmake"
          cmake -S target/tests -B build/tests -G Ninja "$toolchain" -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          cmake -S target/opsy/tests -B build/opsy -G Ninja "$toolchain" -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DKYMO_OPSY_DIR="$GITHUB_WORKSPACE/opsy" -DOPSY_TARGET=m33
          cmake -S target/freertos/tests -B build/freertos -G Ninja "$toolchain" -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DKYMO_FREERTOS_DIR="$GITHUB_WORKSPACE/freertos"

      - name: clang-tidy
        run: |
          set -euo pipefail
          python3 target/tidy.py --clang-tidy clang-tidy --build build/tests --headers target/include
          python3 target/tidy.py --clang-tidy clang-tidy --build build/opsy \
            --headers target/opsy/include target/opsy/tests/ring_check.cpp
          python3 target/tidy.py --clang-tidy clang-tidy --build build/freertos \
            --headers target/freertos/include target/freertos/kymo_freertos.cpp target/freertos/tests/application.cpp \
            target/freertos/tests/bench/bench.cpp

  # OpSy's on-target suite with the adapter's hooks, the adapter's events
  # read back from the ring, and the suite recorded by the host with its trace
  # checked (target/opsy/tests). -Os is what ships, -Og the
  # debug build.
  opsy:
    name: OpSy adapter (cortex-${{ matrix.target }}, ${{ matrix.optimisation }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [m33, m4]
        optimisation: ['-Os;-DNDEBUG', '-Og']
    steps:
      - uses: actions/checkout@v5

      - uses: actions/checkout@v5
        with:
          repository: Otatiaro/OpSy
          ref: ${{ env.OPSY_COMMIT }}
          path: opsy

      - name: Install the arm-none-eabi toolchain
        uses: Otatiaro/arm-none-eabi-toolchain@bdf7759e264645bbcf02cfb66596869ff8684821
        with:
          version: ${{ env.TOOLCHAIN_VERSION }}

      - name: Install Ninja and QEMU
        run: sudo apt-get update && sudo apt-get install -y ninja-build qemu-system-arm

      # The same release build of the host in the four jobs: one cache.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: host
          shared-key: host-release

      # kymo record, for the suite's trace (target/opsy/tests/trace).
      - name: Build the host
        run: |
          sudo apt-get install -y libudev-dev
          cargo build --release --manifest-path host/Cargo.toml

      - name: Configure
        run: >
          cmake -S target/opsy/tests -B build
          -G Ninja
          -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/target/cmake/arm-none-eabi.cmake
          -DKYMO_OPSY_DIR=${{ github.workspace }}/opsy
          -DOPSY_TARGET=${{ matrix.target }}
          "-DOPSY_OPTIMISATION=${{ matrix.optimisation }}"

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

  # What tracing adds to each path of OpSy's bench: the bench built with and
  # without the adapter, in the configuration of OpSy's baseline, and the
  # difference held against target/opsy/tests/bench/overhead-<target>.json.
  opsy-overhead:
    name: OpSy adapter cost per path (cortex-${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: m33
            machine: mps2-an505
          - target: m4
            machine: mps2-an386
    steps:
      - uses: actions/checkout@v5

      - uses: actions/checkout@v5
        with:
          repository: Otatiaro/OpSy
          ref: ${{ env.OPSY_COMMIT }}
          path: opsy

      - name: Install the arm-none-eabi toolchain
        uses: Otatiaro/arm-none-eabi-toolchain@bdf7759e264645bbcf02cfb66596869ff8684821
        with:
          version: ${{ env.TOOLCHAIN_VERSION }}

      - name: Install Ninja and QEMU
        run: sudo apt-get update && sudo apt-get install -y ninja-build qemu-system-arm

      - name: Build the bench, plain and traced
        run: |
          set -euo pipefail
          for variant in plain traced; do
            if [ "$variant" = plain ]; then source=opsy/tests/qemu; else source=target/opsy/tests; fi
            cmake -S "$source" -B "build-$variant" -G Ninja \
              -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/target/cmake/arm-none-eabi.cmake" \
              -DKYMO_OPSY_DIR="$GITHUB_WORKSPACE/opsy" \
              -DOPSY_TARGET=${{ matrix.target }} \
              "-DOPSY_OPTIMISATION=-Os;-DNDEBUG"
            cmake --build "build-$variant" --target opsy_qemu_bench
          done

      - name: Cost per path against the record
        run: >
          python3 target/opsy/tests/bench/overhead.py
          --profile opsy/tests/qemu/bench/profile.py
          --machine ${{ matrix.machine }}
          --plain build-plain/opsy_qemu_bench.elf
          --traced build-traced/opsy/opsy_qemu_bench.elf
          --expected target/opsy/tests/bench/overhead-${{ matrix.target }}.json

  # The FreeRTOS adapter: the test application on the Cortex-M4 (ARM_CM4F) and
  # the Cortex-M33 (ARM_CM33_NTZ), recorded by the host with its trace checked,
  # and the adapter's cost per path held against its record
  # (target/freertos/tests).
  freertos:
    name: FreeRTOS adapter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/checkout@v5
        with:
          repository: FreeRTOS/FreeRTOS-Kernel
          ref: ${{ env.FREERTOS_COMMIT }}
          path: freertos

      - name: Install the arm-none-eabi toolchain
        uses: Otatiaro/arm-none-eabi-toolchain@bdf7759e264645bbcf02cfb66596869ff8684821
        with:
          version: ${{ env.TOOLCHAIN_VERSION }}

      - name: Install Ninja and QEMU
        run: sudo apt-get update && sudo apt-get install -y ninja-build qemu-system-arm

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: host
          shared-key: host-release

      # kymo record, for the application's trace.
      - name: Build the host
        run: |
          sudo apt-get install -y libudev-dev
          cargo build --release --manifest-path host/Cargo.toml

      - name: Configure
        run: >
          cmake -S target/freertos/tests -B build
          -G Ninja
          -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/target/cmake/arm-none-eabi.cmake
          -DKYMO_FREERTOS_DIR=${{ github.workspace }}/freertos

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      # profile.py, which counts the instructions between the bench's markers.
      - uses: actions/checkout@v5
        with:
          repository: Otatiaro/OpSy
          ref: ${{ env.OPSY_COMMIT }}
          path: opsy

      - name: Cost per path against the record
        run: |
          set -euo pipefail
          for pair in m4:mps2-an386:cortex-m4 m33:mps2-an505:cortex-m33; do
            IFS=: read -r target machine cpu <<< "$pair"
            echo "== $cpu"
            python3 target/opsy/tests/bench/overhead.py \
              --profile opsy/tests/qemu/bench/profile.py \
              --machine "$machine" \
              --plain "build/freertos-bench-$cpu-untraced.elf" \
              --traced "build/freertos-bench-$cpu-traced.elf" \
              --expected "target/freertos/tests/bench/overhead-$target.json"
          done