# The untraced bench; traced.conf adds the adapter. What the adapter selects
# besides the tracing is set here too, so that the two images differ by the
# trace alone on the measured paths (the idle hook runs on none).
CONFIG_STD_CPP17=y
CONFIG_CPP=y
CONFIG_REQUIRES_FULL_LIBCPP=y
CONFIG_THREAD_NAME=y

# A tick every period, as the FreeRTOS bench has: the sleep ends on SysTick.
CONFIG_TICKLESS_KERNEL=n
CONFIG_MAIN_THREAD_PRIORITY=3
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_THREAD_MAX_NAME_LEN=16

# The verdict goes through semihosting: no console, no UART interrupt.
CONFIG_SERIAL=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_BOOT_BANNER=n
